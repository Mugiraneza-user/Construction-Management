<div class="space-y-6 animate-fade-in-scale">
  
  <!-- Lock / Shield Header Icon -->
  <div class="flex justify-center pt-1">
    <div class="w-14 h-14 rounded-2xl bg-slate-100 border border-slate-200/80 flex items-center justify-center text-slate-800 shadow-sm">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
    </div>
  </div>

  <!-- Title & Subtitle -->
  <div class="text-center space-y-1.5">
    <h2 class="text-xl font-bold text-slate-900">Verify Code</h2>
    <p class="text-xs text-slate-500 max-w-xs mx-auto">
      We sent a 6-digit verification code to <span class="font-semibold text-slate-800">{{ userEmail }}</span>
    </p>
  </div>

  <!-- Error Alert Banner -->
  <div *ngIf="errorMessage" class="p-3 text-xs text-red-600 bg-red-50 border border-red-200 rounded-xl text-center">
    {{ errorMessage }}
  </div>

  <!-- OTP Form -->
  <form [formGroup]="otpForm" (ngSubmit)="onVerify()" class="space-y-5">
    
    <!-- 6-Digit Code Inputs -->
    <div class="flex justify-center items-center gap-2 sm:gap-2.5" (paste)="onPaste($event)">
      <ng-container *ngFor="let digit of otpDigits; let i = index">
        <input 
          #otpInput
          type="text" 
          inputmode="numeric"
          maxLength="1"
          [formControl]="getControl(i)"
          (input)="onInput($event, i)"
          (keydown)="onKeyDown($event, i)"
          class="w-10 h-12 sm:w-11 sm:h-13 text-center text-lg font-bold border border-slate-200 rounded-xl bg-slate-50/50 text-slate-900 focus:bg-white focus:border-slate-900 focus:ring-2 focus:ring-slate-950/10 outline-none transition-all"
          [ngClass]="{'border-red-400': getControl(i).touched && getControl(i).invalid}"
        />
      </ng-container>
    </div>

    <!-- Resend Countdown Timer -->
    <div class="text-center">
      <p *ngIf="!canResend" class="text-xs text-slate-400">
        Resend code in <span class="font-semibold text-slate-700">{{ resendTimer }}s</span>
      </p>
      <button 
        *ngIf="canResend" 
        type="button" 
        (click)="resendCode()"
        class="text-xs font-semibold text-slate-800 hover:text-black hover:underline cursor-pointer">
        Resend verification code
      </button>
    </div>

    <!-- Action Buttons -->
    <div class="space-y-3">
      <button 
        type="submit" 
        [disabled]="isLoading"
        class="w-full py-3.5 px-4 text-xs font-bold text-white bg-[#111111] hover:bg-black active:scale-[0.99] rounded-xl shadow-lg shadow-black/10 transition-all flex items-center justify-center gap-2 cursor-pointer">
        <span *ngIf="!isLoading">Verify & Proceed</span>
        <span *ngIf="isLoading" class="inline-flex items-center gap-2">
          <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          Verifying...
        </span>
      </button>

      <div class="text-center">
        <a routerLink="/login" class="text-xs font-bold text-slate-400 hover:text-slate-700 transition-colors">
          Back to Login
        </a>
      </div>
    </div>
  </form>
</div>
