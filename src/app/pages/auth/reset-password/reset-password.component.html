<div class="space-y-6 animate-fade-in-scale">
  
  <!-- Line Art Mail Illustration matching upper card in reference photo -->
  <div class="flex justify-center py-2">
    <div class="relative w-28 h-28 flex items-center justify-center">
      <!-- Line art mailbox & envelope illustration -->
      <svg class="w-24 h-24 text-slate-800" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Mailbox Stand and Box -->
        <path d="M40 88V50C40 38 48 30 60 30H64C72 30 78 36 78 44V88" />
        <path d="M32 88H86" />
        <!-- Mailbox Door Curve -->
        <path d="M40 50C40 38 52 38 52 50V88" />
        <!-- Envelopes with Orange Accents -->
        <rect x="18" y="24" width="30" h="20" rx="3" transform="rotate(-15 18 24)" fill="white" stroke="#1e293b" />
        <path d="M18 24L33 34L48 24" transform="rotate(-15 18 24)" />
        
        <rect x="55" y="16" width="26" h="18" rx="3" transform="rotate(18 55 16)" fill="white" stroke="#1e293b" />
        <path d="M55 16L68 25L81 16" transform="rotate(18 55 16)" />
        
        <!-- Orange accent sparkles matching photo -->
        <path d="M22 12L25 18L19 16Z" fill="#f97316" stroke="none" />
        <path d="M78 68L82 74L76 72Z" fill="#f97316" stroke="none" />
      </svg>
    </div>
  </div>

  <!-- STEP 1: Request Email -->
  <div *ngIf="step === 'request'" class="space-y-5">
    <div class="text-center space-y-1.5">
      <h2 class="text-xl font-bold text-slate-900">Reset your password</h2>
      <p class="text-xs text-slate-500 max-w-xs mx-auto">
        Enter the email address associated with your account and we'll send you a link to reset your password.
      </p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onRequestReset()" class="space-y-4">
      <div class="space-y-1.5">
        <label class="block text-[11px] font-semibold text-slate-600 uppercase tracking-wider">
          Email Address
        </label>
        <input 
          type="email" 
          formControlName="email"
          placeholder="username@example.com" 
          class="w-full px-4 py-3 text-xs sm:text-sm border border-slate-200 rounded-xl bg-slate-50/40 text-slate-800 placeholder-slate-400 focus:bg-white focus:border-slate-800 outline-none transition-all"
          [ngClass]="{'border-red-400': resetForm.get('email')?.touched && resetForm.get('email')?.invalid}"
        />
        <p *ngIf="resetForm.get('email')?.touched && resetForm.get('email')?.errors?.['required']" class="text-[10px] text-red-500">
          Email address is required.
        </p>
      </div>

      <button 
        type="submit" 
        [disabled]="isLoading"
        class="w-full py-3.5 px-4 text-xs font-bold text-white bg-[#111111] hover:bg-black active:scale-[0.99] rounded-xl shadow-lg shadow-black/10 transition-all flex items-center justify-center gap-2 cursor-pointer">
        <span *ngIf="!isLoading">Send Reset Instructions</span>
        <span *ngIf="isLoading" class="inline-flex items-center gap-2">
          <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          Sending...
        </span>
      </button>

      <div class="text-center pt-2">
        <a routerLink="/login" class="text-xs font-bold text-slate-500 hover:text-slate-900 transition-colors inline-flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Back to login
        </a>
      </div>
    </form>
  </div>

  <!-- STEP 2: Email Sent Confirmation (Matching reference photo background card text) -->
  <div *ngIf="step === 'sent'" class="space-y-5 text-center">
    <div class="space-y-2">
      <h2 class="text-xl font-bold text-slate-900">Check your email</h2>
      <p class="text-xs text-slate-500 max-w-xs mx-auto leading-relaxed">
        Please check your email and click on the link to reset your password.
      </p>
    </div>

    <div class="pt-2 space-y-3">
      <a 
        routerLink="/login" 
        class="w-full py-3.5 px-4 text-xs font-bold text-white bg-[#111111] hover:bg-black active:scale-[0.99] rounded-xl shadow-lg shadow-black/10 transition-all flex items-center justify-center gap-2 cursor-pointer">
        Back to login
      </a>

      <p class="text-[11px] text-slate-400">
        Didn't receive the email? 
        <button (click)="resendEmail()" class="font-semibold text-slate-800 hover:underline">Click to resend</button>
      </p>
    </div>
  </div>
</div>
