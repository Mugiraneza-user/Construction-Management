<div class="space-y-5 animate-fade-in-scale">
  <div class="flex justify-center mb-4">
    <div class="inline-flex p-1 bg-slate-100 rounded-full border border-slate-200/60 shadow-inner">
      <a 
        routerLink="/login" 
        class="px-6 py-2 text-xs font-semibold rounded-full cursor-pointer text-slate-500 hover:text-slate-900 transition-all duration-200">
        Sign in
      </a>
      <button 
        type="button" 
        class="px-6 py-2 text-xs font-semibold rounded-full bg-white text-slate-900 shadow-sm transition-all duration-200">
        Register
      </button>
    </div>
  </div>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-3.5">
    
    <div class="space-y-1">
      <label class="block text-[11px] font-semibold text-slate-600 uppercase tracking-wider">
        Username
      </label>
      <input 
        type="text" 
        formControlName="UserName"
        placeholder="John " 
        class="w-full px-4 py-2.5 text-xs sm:text-sm border border-slate-200 rounded-xl bg-slate-50/40 text-slate-800 placeholder-slate-400 focus:bg-white focus:border-slate-800 focus:ring-2 focus:ring-slate-950/5 outline-none transition-all"
        [ngClass]="{'border-red-400': registerForm.get('userName')?.touched && registerForm.get('userName')?.invalid}"
      />
      <p *ngIf="registerForm.get('userName')?.touched && registerForm.get('userName')?.errors?.['required']" class="text-[10px] text-red-500">
        Username is required.
      </p>
    </div>
    <div class="space-y-1">
      <label class="block text-[11px] font-semibold text-slate-600 uppercase tracking-wider">
        First Name
      </label>
      <input 
        type="text" 
        formControlName="firstName"
        placeholder="Doe" 
        class="w-full px-4 py-2.5 text-xs sm:text-sm border border-slate-200 rounded-xl bg-slate-50/40 text-slate-800 placeholder-slate-400 focus:bg-white focus:border-slate-800 focus:ring-2 focus:ring-slate-950/5 outline-none transition-all"
        [ngClass]="{'border-red-400': registerForm.get('firstName')?.touched && registerForm.get('firstName')?.invalid}"
      />
      <p *ngIf="registerForm.get('firstName')?.touched && registerForm.get('firstName')?.errors?.['required']" class="text-[10px] text-red-500">
        First name is required.
      </p>
    </div>
    <div class="space-y-1">
      <label class="block text-[11px] font-semibold text-slate-600 uppercase tracking-wider">
        Last Name
      </label>
      <input 
        type="text" 
        formControlName="lastName"
        placeholder="John" 
        class="w-full px-4 py-2.5 text-xs sm:text-sm border border-slate-200 rounded-xl bg-slate-50/40 text-slate-800 placeholder-slate-400 focus:bg-white focus:border-slate-800 focus:ring-2 focus:ring-slate-950/5 outline-none transition-all"
        [ngClass]="{'border-red-400': registerForm.get('lastName')?.touched && registerForm.get('lastName')?.invalid}"
      />
      <p *ngIf="registerForm.get('lastName')?.touched && registerForm.get('lastName')?.errors?.['required']" class="text-[10px] text-red-500">
        Last name is required.
      </p>
    </div>

    
    <div class="space-y-1">
      <label class="block text-[11px] font-semibold text-slate-600 uppercase tracking-wider">
        Email
      </label>
      <input 
        type="email" 
        formControlName="email"
        placeholder="john@gmail.com" 
        class="w-full px-4 py-2.5 text-xs sm:text-sm border border-slate-200 rounded-xl bg-slate-50/40 text-slate-800 placeholder-slate-400 focus:bg-white focus:border-slate-800 focus:ring-2 focus:ring-slate-950/5 outline-none transition-all"
        [ngClass]="{'border-red-400': registerForm.get('email')?.touched && registerForm.get('email')?.invalid}"
      />
      <p *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.errors?.['email']" class="text-[10px] text-red-500">
        Please enter a valid email address.
      </p>
    </div>
     <div class="space-y-1">
      <label class="block text-[11px] font-semibold text-slate-600 uppercase tracking-wider">
        Telephone Number
      </label>
      <input 
        type="telephone" 
        formControlName="telephone"
        placeholder="+250780000000" 
        class="w-full px-4 py-2.5 text-xs sm:text-sm border border-slate-200 rounded-xl bg-slate-50/40 text-slate-800 placeholder-slate-400 focus:bg-white focus:border-slate-800 focus:ring-2 focus:ring-slate-950/5 outline-none transition-all"
        [ngClass]="{'border-red-400': registerForm.get('telephone')?.touched && registerForm.get('telephone')?.invalid}"
      />
      <p *ngIf="registerForm.get('telephone')?.touched && registerForm.get('telephone')?.errors?.['required']" class="text-[10px] text-red-500">
        Telephone number is required.
      </p>
    </div>   
   
      <div class="space-y-1">
        <label class="block text-[11px] font-semibold text-slate-600 uppercase tracking-wider">
          Password
        </label>
        <div class="relative">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            formControlName="password"
            placeholder="••••••••" 
            class="w-full pl-3.5 pr-8 py-2.5 text-xs border border-slate-200 rounded-xl bg-slate-50/40 text-slate-800 placeholder-slate-400 focus:bg-white focus:border-slate-800 outline-none transition-all"
            [ngClass]="{'border-red-400': registerForm.get('password')?.touched && registerForm.get('password')?.invalid}"
          />
          <button 
            type="button" 
            (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-600">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
        <p *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors?.['required']" class="text-[10px] text-red-500">
          Password is required.
        </p>
        <p *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors?.['minlength']" class="text-[10px] text-red-500">
          Password must be at least 8 characters long.
        </p>
    </div>
    
    <div class="flex items-center gap-2 pt-1">
      <input 
        type="checkbox" 
        id="agreeTerms" 
        formControlName="agreeTerms"
        class="w-4 h-4 rounded border-slate-300 text-slate-900 focus:ring-slate-800 cursor-pointer"
      />
      <label for="agreeTerms" class="text-xs font-medium text-slate-800 cursor-pointer">
        I agree to the Terms of Service & Privacy Policy
      </label>
    </div>
    <button 
      type="submit" 
      [disabled]="isLoading"
      class="w-full py-3.5 px-4 mt-2 text-xs font-bold text-white bg-[#111111] hover:bg-black active:scale-[0.99] rounded-xl shadow-lg shadow-black/10 transition-all flex items-center justify-center gap-2 cursor-pointer">
      <span  class="text-white">Create account </span>
      <span *ngIf="isLoading" class="inline-flex items-center gap-2">
        <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        Creating account...
      </span>
    </button>
  </form>
</div>
